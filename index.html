<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AuraMart: an e-commerce store with an AI shopping assistant."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>AuraMart</title>
    <script>
      // Apply the saved theme before first paint, so dark-mode visitors do not see a flash of light.
      (function () {
        try {
          var choice = localStorage.getItem('auramart.theme');
          var dark =
            choice === 'dark' ||
            ((choice === null || choice === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (error) {
          // Storage is unavailable: the app applies the system theme after it loads.
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
